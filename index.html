<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the HUD can use the safe-area insets on a notched
       phone; user-scalable=no because a pinch-zoom mid-corner is fatal. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A full-simulation Formula 1 career game that runs in the browser on desktop and iOS." />
  <title>F1Sim — Formula Simulation</title>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
  </div>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div id="loading-text">BUILDING CIRCUIT</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
